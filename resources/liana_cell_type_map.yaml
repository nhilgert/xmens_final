# LIANA cell-type merging for cross-species comparison (2026-09-09).
# Port of decidualization/revisions/liana_pipeline_final/merge_immune_xspecies.ipynb (2026-06-08)
# to the 2026_08_28 deliverable objects' `cell_subtype` vocabulary.
#   cell_type_merged   : immune subtypes -> lineage; stromal subtypes -> coarse class; myeloid lineages kept distinct
#   cell_type_xspecies : cell_type_merged with Macrophage/Mast/Monocyte/DC -> Myeloid (cross-species join key)
# Every source label must appear in base_map or passthrough (the scripts assert this).
# Decisions (user, 2026-09-09): human perivascular_cell kept as human-only (analogous to mouse perimetrial_cell);
# human epithelial_ciliated -> epithelial_cell and endothelial_lymph -> endothelial_cell (June granularity).
source_column: cell_subtype
base_map:
  # ---------- immune: subtype -> lineage ----------
  t_cell_cd8: T                          # human
  t_cell_cd4: T                          # human
  t_cell_regulatory: T                   # human
  t_cell_gamma_delta: T                  # both
  t_cell: T                              # mouse
  unk_cell_gzmb_low_itgax_low: NK        # human
  unk_cell_gzmb_high_itgax_high: NK      # human
  unk_cell_gzmb_low_itgax_high: NK       # mouse
  unk_cell_gzmb_high_itgax_low: NK       # mouse
  unk_cell_proliferative: NK             # mouse
  macrophage: Macrophage                 # both
  macrophage_proliferative: Macrophage   # mouse
  mast_cell: Mast                        # human
  monocyte: Monocyte                     # mouse
  dendritic_cell: DC                     # mouse
  b_cell: B                              # mouse
  # ---------- stroma / other: subtype -> coarse ----------
  decidual_proliferative: decidual_cell  # mouse
  decidual_mature: decidual_cell         # mouse
  decidual_boundary: decidual_cell       # mouse
  decidual_apoptotic: decidual_cell      # mouse
  efib_middle: endometrial_fibroblast    # mouse
  efib_middle_induced: endometrial_fibroblast
  efib_subluminal: endometrial_fibroblast
  efib_outer: endometrial_fibroblast
  efib_proliferative: endometrial_fibroblast
  epithelial_ciliated: epithelial_cell   # human
  endothelial_blood: endothelial_cell    # both
  endothelial_lymph: endothelial_cell    # human
passthrough:                             # already coarse; kept verbatim
  - decidual_cell
  - endometrial_fibroblast
  - epithelial_cell
  - smooth_muscle_cell
  - perivascular_cell                    # human only (no mouse counterpart)
  - perimetrial_cell                     # mouse only (no human counterpart)
to_lcd:                                  # cell_type_merged -> cell_type_xspecies
  Macrophage: Myeloid
  Mast: Myeloid
  Monocyte: Myeloid
  DC: Myeloid

# ---------------------------------------------------------------------------
# Cross-species deliverable (workflow/scripts/liana_crossspecies.py), added 2026-09-10.
# Keys are cell_type_merged labels (values of base_map + passthrough).
# compartment_map : rollup for the strict matched-context compartment heatmaps
#                   (immune lineages -> 'immune'; June notebook COMPARTMENT_MAP)
# display_names   : labels used in the xlsx/CSV deliverables (June CELLTYPE_DISPLAY convention)
# compartment_order / heatmap_drop : heatmap axis order; species-only compartments dropped
#                   from the heatmaps (they can never be conserved). Tables keep them.
compartment_map:
  Macrophage: immune
  Monocyte: immune
  DC: immune
  Mast: immune
  NK: immune
  T: immune
  B: immune
  decidual_cell: decidual_cell
  endometrial_fibroblast: endometrial_fibroblast
  epithelial_cell: epithelial_cell
  smooth_muscle_cell: smooth_muscle_cell
  endothelial_cell: endothelial_cell
  perivascular_cell: perivascular_cell   # human-only under the 2026_08_28 annotation
  perimetrial_cell: perimetrial_cell     # mouse-only
display_names:
  immune: immune (pooled)
  Macrophage: macrophages
  Monocyte: monocytes
  DC: dendritic cells
  Mast: mast cells
  NK: NK cells
  T: T cells
  B: B cells
  decidual_cell: decidual cells
  endometrial_fibroblast: endometrial fibroblasts
  epithelial_cell: epithelial cells
  smooth_muscle_cell: smooth muscle cells
  endothelial_cell: endothelial cells
  perivascular_cell: perivascular cells
  perimetrial_cell: perimetrial cells
compartment_order: [immune, Macrophage, Monocyte, DC, Mast, NK, T, B, decidual_cell, endometrial_fibroblast,
                    epithelial_cell, smooth_muscle_cell, endothelial_cell, perivascular_cell, perimetrial_cell]
heatmap_drop: [perivascular_cell, perimetrial_cell]
