    endometrial_fibroblast: "Endometrial fibroblasts"
    epithelial_cell: "Epithelial cells"
    endothelial_cell: "Endothelial cells"
    perivascular_cell: "Perivascular cells"
    perimetrial_cell: "Perimetrium mesothelial cells"
    smooth_muscle_cell: "Smooth muscle cells"
    immune_cell: "Immune cells"
  cell_subtype:
    decidual_boundary: "Decidual boundary (dec1)"
    decidual_proliferative: "Proliferative decidual (dec2)"
    decidual_mature: "Mature decidual (dec3)"
    decidual_apoptotic: "Apoptotic decidual (decAp)"
    efib_outer: "Outer eFib (eFib1)"
    efib_middle: "Middle eFib (eFib2)"
    efib_middle_induced: "Induced middle eFib (eFib2i)"
    efib_subluminal: "Subluminal eFib (eFib3)"
    efib_proliferative: "Proliferative eFib (eFibP)"
    epithelial_ciliated: "Ciliated epithelial cells"
    endothelial_blood: "Blood endothelial cells"
    endothelial_lymph: "Lymphatic endothelial cells"
    macrophage: "Macrophages"
    macrophage_proliferative: "Proliferative macrophages"
    monocyte: "Monocytes"
    dendritic_cell: "Dendritic cells"
    t_cell: "T cells"
    t_cell_cd4: "CD4 T cells"
    t_cell_cd8: "CD8 T cells"
    t_cell_regulatory: "Regulatory T cells"
    t_cell_gamma_delta: "Gamma/delta T cells"
    b_cell: "B cells"
    mast_cell: "Mast cells"
    unk_cell_proliferative: "Proliferative uNK cells"
    unk_cell_gzmb_high_itgax_low: "GZMB-hi/ITGAX-lo uNK cells"
    unk_cell_gzmb_low_itgax_high: "GZMB-lo/ITGAX-hi uNK cells"
    unk_cell_gzmb_high_itgax_high: "GZMB-hi/ITGAX-hi uNK cells"
    unk_cell_gzmb_low_itgax_low: "GZMB-lo/ITGAX-lo uNK cells"

# ----------------------------------------------------------------------------
# Legacy aliases: v1 strings that may appear in older objects, figures or notebooks.
# Consumers may use this to migrate an old object forward. NEVER write these values.
# ----------------------------------------------------------------------------
legacy_aliases:
  cell_type:
    mesothelial_cell: perimetrial_cell
  cell_subtype:
    decidual_border: decidual_boundary
    efib_myometrial: efib_outer
