  primary: dS_vs_C7fib_luteal_follicular
  contrasts:
  - id: dS_vs_C7fib_luteal_follicular
    label: all decidual stroma (dS1-3) vs C7-Fibroblast, within donor, luteal- and follicular-phase donors
    decidual: &id001
    - dS1
    - dS2
    - dS3
    reference: &id002
    - C7-Fibroblast
    donor_filter:
      field: menstrual_phase_at_collection
      keep:
      - luteal
      - follicular
  - id: dS_vs_C7fib_all_donors
    label: all decidual stroma (dS1-3) vs C7-Fibroblast, within donor, all donors (adds the donor with no recorded phase)
    decidual: *id001
    reference: *id002
  - id: dS_vs_C7fib_luteal
    label: all decidual stroma (dS1-3) vs C7-Fibroblast, within donor, luteal-phase donors only
    decidual: *id001
    reference: *id002
    donor_filter: &id003
      field: menstrual_phase_at_collection
      keep:
      - luteal
  - id: dS_vs_C7fib_luteal_floor10
    label: all decidual stroma (dS1-3) vs C7-Fibroblast, within donor, luteal-phase donors only, 10-cell floor (sensitivity)
    decidual: *id001
    reference: *id002
    donor_filter: *id003
    cell_floor: 10
  - id: dS_vs_nondecidual_luteal
    label: all decidual stroma (dS1-3) vs all non-decidual stroma (C7-Fibroblast + eS-proliferative), within donor, luteal-phase donors only
    decidual:
    - dS1
    - dS2
    - dS3
    reference:
    - C7-Fibroblast
    - eS-proliferative
    donor_filter:
      field: menstrual_phase_at_collection
      keep:
      - luteal
  - id: dS_vs_nondecidual
    label: all decidual stroma (dS1-3) vs all non-decidual stroma (C7-Fibroblast + eS-proliferative), within donor
    decidual:
    - dS1
    - dS2
    - dS3
    reference:
    - C7-Fibroblast
    - eS-proliferative
  - id: phase_luteal_vs_follicular
    kind: between_donor
    label: endometrial stroma (dS1-3), luteal vs follicular donors
    labels:
    - dS1
    - dS2
    - dS3
    factor_field: menstrual_phase_at_collection
    numerator: luteal
    denominator: follicular
    covariate_field: Data_source
  - id: dS1_vs_dS23
    label: dS1 vs dS2 + dS3 within donor (decidualized vs non-decidualized stroma)
    decidual:
    - dS1
    reference:
    - dS2
    - dS3
  - id: dS1_vs_C7fib
    label: dS1 vs C7-Fibroblast within donor
    decidual:
    - dS1
    reference:
    - C7-Fibroblast
