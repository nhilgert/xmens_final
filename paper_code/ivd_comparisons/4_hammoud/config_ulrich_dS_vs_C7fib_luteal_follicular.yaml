# cagri_ivd_ulrich_deseq2: Ulrich 2024 replaces HECA F as the human atlas; PyDESeq2 for both species.
# Mouse preparation, zones, support rule and reused resources are copied verbatim from the upstream config (sha256 under upstream).
# human.primary picks the contrast that feeds the workbook headline; every listed contrast is fitted and tabulated.
# acceptance: filled from acceptance_observed.yaml of a --record run, after review. A verify run must reproduce it exactly.
# v6 (2026-10-19): primary = all decidual stroma (dS1-3) vs C7-Fibroblast only, within donor, luteal-phase donors only (20-cell floor);
#   the same with a 10-cell floor as a sensitivity contrast; the v5 pooled-reference contrast and earlier contrasts kept as secondary.
# v7 (2026-10-28): primary = all decidual stroma (dS1-3) vs C7-Fibroblast only, within donor, luteal- and follicular-phase donors
#   (the proliferative-phase donors are back in); the same with all donors (adds D3, no recorded phase) as a secondary contrast;
#   the v6 contrasts kept as secondary. Everything else is unchanged from v6.
