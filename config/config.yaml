# ---------------------------------------------------------------------------
# zone_modules (stage 16, added 2026-10-24) -- decidual-zone AUCell modules,
# mouse. Rules: workflow/rules/16_zone_modules.smk; target: zone_modules_all.
# Settled with the user (2026-10-22/24): pySCENIC default window
# (auc_threshold 0.05), seed 0 (MD, C and AMMy lose specificity at this
# window; the legend says so), raw counts as for SCENIC, the gene sets of
# Li et al. 2022 Table 1 verbatim, 3 dpi nuclei only. Add a run rather than
# edit one: each run has its own results/zone_aucell/<run>/ and
# results/figures/zone_modules/<run>/.
# 2026-10-26 (user): rank genes as for SCENIC (count > 0 in >= 1% of the
# object's nuclei) plus the Table 1 genes below 1% that are still detected
# (>= 1 nucleus): run table1_auc005_g1pct_seed0_3dpi, the run of record. The
# all-genes run stays for comparison (results/zone_aucell/2026_10_26_gene_universe_*).
# ---------------------------------------------------------------------------
zone_modules:
  python: /n/lab_storage/eddy_lab/users/nhilgert/.uv/envs/rsc_uv/bin/python   # pyscenic 0.12.1, ctxcore 0.2.0
  cache_dir: /n/lab_storage/eddy_lab/users/nhilgert/.cache_scratch   # numba/matplotlib caches (HOME is full)
  h5ad: "data/deliverables/2026_09_15/Cevrim_XMens_All_Cells.h5ad"
  release_manifest: "data/deliverables/2026_09_15/MANIFEST.json"   # the object's sha256 is checked against this
  object_name: Cevrim_XMens_All_Cells
  embedding_outliers: "resources/embedding_outliers_mouse_2026_10_13.csv"   # 34 nuclei: hidden in spatial panels, kept in heatmaps
  runs:
    table1_auc005_seed0_3dpi:
      genesets: "resources/signatures/aucell_modules_mouse.yaml"
      auc_threshold: 0.05
      seed: 0
      normalization: none   # raw counts; cp10k gives identical scores (ranks are within each nucleus)
      timepoints: ["3_dpi"]
    table1_auc005_g1pct_seed0_3dpi:   # 2026-10-26 (user): the run of record
      genesets: "resources/signatures/aucell_modules_mouse.yaml"
      auc_threshold: 0.05
      seed: 0
      normalization: none
      timepoints: ["3_dpi"]
      gene_filter_frac: 0.01      # rank genes with count > 0 in >= 1% of the object's nuclei (SCENIC loom rule)...
      keep_geneset_genes: true    # ...plus the Table 1 genes below 1% that are still detected
      geneset_min_cells: 1        # detected = count > 0 in >= 1 nucleus of the object (drops Prl4a1, Cts7, Prl2a1)
  figures:   # fig_zone_modules.py invocations, rendered for every run (light + dark, PNG + SVG + sidecar)
    - name: spatial_3dpi_rot135_noapop
      args: "--figures spatial --timepoint 3_dpi --drop-apoptotic --rotate 135 --modules PDZ,TDZ,SDZ,VSZ,MD,udStr"
    - name: spatial_3dpi_rot135_noapop_viridis
      args: "--figures spatial --timepoint 3_dpi --drop-apoptotic --rotate 135 --modules PDZ,TDZ,SDZ,VSZ,MD,udStr --cmap viridis"
    - name: heatmap_3dpi_6zones_fibpooled_p99
      args: "--figures heatmap --heatmap-scale p99 --heatmap-timepoint 3_dpi --modules PDZ,TDZ,SDZ,VSZ,MD,udStr --pool-fib"
    - name: heatmap_3dpi_6zones_fibpooled_p99_viridis
      args: "--figures heatmap --heatmap-scale p99 --heatmap-timepoint 3_dpi --modules PDZ,TDZ,SDZ,VSZ,MD,udStr --pool-fib --cmap viridis"
