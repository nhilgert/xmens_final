# config/config.yaml
# All parameters/thresholds live here. Values pinned to Cevrim et al. 2025
# (bioRxiv 2025.10.08.681007) Methods so the repo reproduces the paper.
# The run is described by this file + config/samples.tsv.

seed: 0

# ---- References (cellranger count was run against these) -------------------
# Mouse: custom transgenic genome (GsD + GqD DREADD contigs), mkref 7.2.0.
#   Transgene FASTA/GTF preserved in preprocessing/reference/transgenes/.
# Human: stock 10x reference (downloadable), no transgenes.
references:
  mouse:
    name: "transgenic_mus"
    path: "/n/eddy_lab/users/nhilgert/reference/transgenic_mus"
    mkref_version: "7.2.0"
    transgenes: ["CHRM3_Jax026220 (GqD / Chrm3*)", "GsD_Berdeaux (GsD)"]
    note: "custom build; not a stock refdata. See preprocessing/reference/."
  human:
    name: "refdata-gex-GRCh38-2024-A"
    path: "/n/eddy_lab/users/nhilgert/reference/human/refdata-gex-GRCh38-2024-A"

cellranger:
  count_version: "7.2.0"
  mkfastq_version: "8.0.1"

# ---- Ambient RNA removal (upstream of this DAG; documented for provenance) -
cellbender:
  version: "0.2.2"                      # installed from git tag v0.2.2 into cellbender_022
  total_droplets_included: 50000
  env: "cellbender_022"                 # clean 0.2.2 env (libstdcxx-ng, no LD hack)
  # CellRanger raw matrix per lane; {lane} is resolved from the sample's coords_id
  cellranger_raw: "/n/eddy_lab/users/nhilgert/decidualization/revisions/velocity/{lane}/cellranger/outs/raw_feature_bc_matrix.h5"
  # PARALLEL regen dir -- NEVER the real xmens_inputs/. Keeps the validated baseline intact.
  output_dir: "/n/eddy_lab/users/nhilgert/decidualization/xmens_inputs_regen"

# ---- Slide-tags coords (produced by the vendored fork; see 00a) -----------
# export_coords.R writes <coords_id>_coords.csv into this dir. We use the
# DBSCAN-placed coordinates (more permissive superset of x_um/y_um).
coords:
  dir: "/n/eddy_lab/users/nhilgert/Slide-tags/coords"
  pattern: "{coords_id}_coords.csv"
  x_col: "dbscan_1"
  y_col: "dbscan_2"

# ---- Per-rule conda environments ------------------------------------------
# Rules that need a tool absent from the driver env (rsc_uv / envs/base) point
# their Snakemake `conda:` directive at one of these. Rules WITHOUT an entry run
# in whatever env invoked snakemake (the scanpy spine). Absolute paths for now;
# for the public repo, replace with committed environment.yml files.
#   - doubletdetection: DoubletDetection 4.2 + scanpy (used by 01_qc). The
#     louvain dep won't build under uv/pip, so this stays conda. CLEAN UP LATER.
#   - scenic / samap: existing conda envs (placeholders; used by 21_scenic /
#     22_crossspecies when those rules are wired). Confirm paths before use.
envs:
  doubletdetection: "/n/eddy_lab/users/nhilgert/.conda/envs/cuda11.8_env"
  scenic: "/n/eddy_lab/users/nhilgert/.conda/envs/pyscenic"
  samap: "/n/eddy_lab/users/nhilgert/.conda/envs/SAMap"
  # r: "/n/eddy_lab/users/nhilgert/.conda/envs/<analysis-R-env>"  # add when R rules land

# ---- Quality control (Methods: "Quality control") -------------------------
# CellBender-corrected counts; >=500 UMIs; 3-MAD adaptive filters on
# log1p total counts and n_genes; mito fraction > 8% excluded.
qc:
  min_counts: 500          # CellBender-corrected UMIs
  n_mads: 3                # MADs on log1p(total_counts) and log1p(n_genes)
  max_pct_mito: 8          # paper value (NOT 20)
mito_prefix:
  mouse: "mt-"
  human: "MT-"

# ---- Doublet removal (DoubletDetection BoostClassifier) -------------------
doublet:
  package: "doubletdetection"
  version: "4.2"
  n_iters: 40
  voter_thresh: 0.5
  p_thresh: 1.0e-7         # cluster p-value cutoff per iteration
  n_top_var_genes: 3000    # n_top_var_genes for the BoostClassifier (matches notebook)

# ---- Dimensionality reduction / integration (scVI) ------------------------
# Per-species concatenated objects; scVI on 3000 seurat_v3 HVGs (excl mito+
# ribo), sample_id as batch key, 2 layers, 30 latent, NB likelihood.
scvi:
  n_hvg: 3000
  hvg_flavor: "seurat_v3"
  n_latent: 30
  n_layers: 2
  batch_key: "sample"
  exclude_mito_ribo: true

leiden:
  resolution: 0.1          # chosen for coarse cell-type annotation
  knn: 100

# ---- Pseudotime (diffusion) -----------------------------------------------
pseudotime:
  knn: 15
  n_diffmap: 10

# ---- Pseudotime-associated genes (mutual information) ---------------------
mi:
  n_neighbors: 3
  n_perm: 1000
  q_thresh: 0.05
  top_percentile: 90

# ---- Expected post-QC cell counts (regression targets from the paper) -----
# Use to sanity-check a full pipeline run; not enforced.
expected_cells:
  mouse_postqc: 57242
  human_postqc: 64553
