# ---------------------------------------------------------------------------
# spatial_qc (stage 04f) -- "blank, don't drop" spatial-coordinate QC applied
# AFTER annotation. Purely spatial: only coordinates drive it. Ported from
# notebooks/01b_spatial_qc_mouse.ipynb. Mouse only for now (human deferred until
# the slide-tags positioning rerun). Rotations 0 = identity (no rotation yet).
# ---------------------------------------------------------------------------
spatial_qc:
  species: [mouse]           # human deferred; add "human" after the slidetags rerun
  x_key: x_um_dbscan
  y_key: y_um_dbscan
  sample_key: sample
  timepoint_key: timepoint
  k: 5                       # kNN neighbours for local-density distance
  floor_um: 10.0             # min_knn_dist_um -- physical resolution floor
  max_at_coord: 1            # >1 cell at an identical coord -> degenerate
  n_mads: 5.0                # far cut: median + n_mads*mad_scale*MAD ... (was 3.0 with mad_scale 1.4826 = 4.45 raw MADs)
  mad_scale: 1.0             # 1.0 = plain MADs; 1.4826 would express n_mads in sigma units
  log_scale: true            # ... computed on log1p(distance)
  mad_group: timepoint       # far threshold pooled per timepoint
  # 04f runs before the release, on the sample sheet's timepoint names (config/samples.tsv):
  # 1_dpi_early ... 4_dpi_bleeding here are released as 1.5_dpi_early ... 4.5_dpi_bleeding (vocabulary v5).
  action: blank
  drop_unmapped: false       # coordinate-less cells are KEPT (normal for slide-tags)
  tp_order:
    mouse: [uninduced, 1_dpi_early, 1_dpi_late, 2_dpi, 3_dpi, 4_dpi_bleeding]
  # Per-timepoint rigid rotation about each puck centre. All 0 for now.
  rotations:
    mouse:
      uninduced: 0.0
      1_dpi_early: 0.0
      1_dpi_late: 0.0
      2_dpi: 0.0
      3_dpi: 0.0
      4_dpi_bleeding: 0.0
  # Physical cross-sections per puck. Every kept cell gets tissue_section = "{sample}__A"
  # unless its timepoint is listed here, in which case a straight line in the coordinate
  # frame splits it: y > slope*x + intercept -> `above` label, else `below`. Uninduced is
  # the only mouse timepoint with two cross-sections on one puck (both pucks share a frame;
  # line chosen 2026-09-02, agrees with k-means(2) on all 6,596 cells, margin >= 127 um).
  sections:
    mouse:
      - {timepoint: uninduced, line: {slope: 1.0, intercept: -500}, above: A, below: B}
  # Hand-drawn exclusion regions (um, on x_um_dbscan/y_um_dbscan) the distance
  # statistics miss. The 3-dpi central island is deliberately NOT boxed -- it is
  # transcriptionally coherent, a real spatial domain.
  exclusions:
    mouse:
      # --- uninduced: union of all exclusions in minimal form (rewritten 2026-09-02). Each box verified to cover every
      #     previously-boxed cell and to add only the user-named stragglers. Both pucks (mck8a/8b) share one frame.
      - {timepoint: uninduced,   y_gt: 5000}                 # above both sections
      - {timepoint: uninduced,   x_lt: 500}                  # left margin
      - {timepoint: uninduced,   x_lt: 3000, y_lt: 1950}     # below-left; absorbs old (x<3000,y<1500) + (2500<x<3000,1500<y<2000) + clump [1300,1600]x[1700,1900]
      - {timepoint: uninduced,   x_lt: 3400, y_lt: 700}      # low strip for the isolated pair at [3000,3400]x[500,600]; right-section rim (y>=1036) untouched
      - {timepoint: uninduced,   x_gt: 5400, y_gt: 3000}     # top-right stragglers (paired positions in 8a/8b)
      # --- induced timepoints
      - {timepoint: 1_dpi_early , x_lt: 750}
      - {timepoint: 2_dpi       , y_gt: 7000}
      - {timepoint: 3_dpi       , y_gt: 9000}
      - {timepoint: 3_dpi       , y_lt: 1500, x_gt: 6500}
      - {timepoint: 3_dpi       , x_gt: 9000, y_gt: 8000}

# ---------------------------------------------------------------------------
# samap_raw (added 2026-09-15): the pt-transfer variant table. The EMPTY suffix
# reproduces the pre-existing behaviour exactly (column dpt_pseudotime, legacy
# output path runs_raw/<arm>/pt_transfer/), so nothing already on disk is
# re-pointed or overwritten; '_noapop' is the settled no-apoptotic coordinate
# and lands beside it in runs_raw/<arm>/pt_transfer_noapop/.
samap_raw:
  pt_h5ad: "data/deliverables/2026_09_15/Cevrim_XMens_Only_Fib_Dec_Cells.h5ad"   # pt transfer of record; later releases are relabel-only
  pt_variants:
    "": dpt_pseudotime
    "_noapop": dpt_pseudotime_no_apoptotic
    # The transfer of record (2026-10-24): pt_harmonized of the Oct 22 release, read from its lab_storage copy
    # (sha256-identical to the netscratch object the transfer was first run from).
    "_harmonized": {col: pt_harmonized, h5ad: "data/deliverables/2026_10_22_flagged_harmonized/Cevrim_XMens_Only_Fib_Dec_Cells.h5ad"}

# ---------------------------------------------------------------------------
# samap_figures (stage 10c, added 2026-10-29) -- SAMap supplementary figure,
# Fig. 6 transferred-pseudotime panels, and the permutation control of the
# pseudotime transfer. Rules: workflow/rules/10c_samap_figures.smk;
# target: samap_figures_all. Labels, coordinates and embedding_outlier flags come
# from the release of record (deliverables.version), the human pseudotime from
# pseudotime_of_record.human.
# ---------------------------------------------------------------------------
samap_figures:
  # Interpreter and caches: config/panels.yaml (panels.python, panels.cache_dir).
  arm: vanilla_raw                 # SAMap run of record (10b)
  pt_variant: "_harmonized"        # samap_raw pt variant whose transfer the figures show
  ptnull_seed: 20261022
  ptnull_n_perm: 1000              # permutations per design
  main_panel_date: "20261027"      # date stem of the Fig. 6 spatial panel files

# ---------------------------------------------------------------------------
# zone_modules (stage 16, added 2026-10-24) -- decidual-zone AUCell modules,
# mouse. Rules: workflow/rules/16_zone_modules.smk; target: zone_modules_all.
# Settled with the user (2026-10-22/24): pySCENIC default window
# (auc_threshold 0.05), seed 0 (MD, C and AMMy lose specificity at this
# window; the legend says so), raw counts as for SCENIC, the gene sets of
# Li et al. 2022 Table 1 verbatim, 3.5 dpi nuclei only. Add a run rather than
# edit one: each run has its own results/zone_aucell/<run>/ and
# results/figures/zone_modules/<run>/.
# 2026-10-26 (user): rank genes as for SCENIC (count > 0 in >= 1% of the
# object's nuclei) plus the Table 1 genes below 1% that are still detected
# (>= 1 nucleus): run table1_auc005_g1pct_seed0_3dpi, the run of record. The
# all-genes run stays for comparison (results/zone_aucell/2026_10_26_gene_universe_*).
# 2026-10-28: reads release 2026_10_28 (vocabulary v6; scores unchanged, the release is
# relabel-only). Run and figure names keep the names they were created under (3dpi = 3.5 dpi).
# ---------------------------------------------------------------------------
zone_modules:
  # Interpreter (needs pyscenic 0.12.1, ctxcore 0.2.0) and caches: config/panels.yaml (panels.python, cache_dir).
  # 2026-10-30 (user): re-pointed from 2026_10_29b to 2026_10_30 (vocabulary v9; mouse immune, vascular and smc
  # lineages re-annotated in round 2, whole-tissue embedding re-fitted, outlier flags recomputed); the 2026_10_29b
  # results are kept in /n/netscratch/eddy_lab/Everyone/nhilgert/2026_10_30_downstream_backup.
  # 2026-10-29 (user): re-pointed from 2026_10_28 to 2026_10_29b (vocabulary v8; 18 low-quality luminal nuclei
  # dropped, mouse whole-tissue embedding re-fitted, outlier flags recomputed); the 2026_10_28 results are kept in
  # /n/netscratch/eddy_lab/Everyone/nhilgert/2026_10_29b_downstream_backup.
  # The object scored is <object_name>.h5ad of the release of record (deliverables.version), its sha256 checked
  # against that release's MANIFEST.json (16_zone_modules.smk).
  object_name: Cevrim_XMens_All_Cells
  # The spatial panels hide the release object's embedding_outlier nuclei (obs embedding_outlier); heatmaps keep them.
  runs:
    table1_auc005_seed0_3dpi:
      genesets: "resources/signatures/aucell_modules_mouse.yaml"
      auc_threshold: 0.05
      seed: 0
      normalization: none   # raw counts; cp10k gives identical scores (ranks are within each nucleus)
      timepoints: ["3.5_dpi"]
    table1_auc005_g1pct_seed0_3dpi:   # 2026-10-26 (user): the run of record
      genesets: "resources/signatures/aucell_modules_mouse.yaml"
      auc_threshold: 0.05
      seed: 0
      normalization: none
      timepoints: ["3.5_dpi"]
      gene_filter_frac: 0.01      # rank genes with count > 0 in >= 1% of the object's nuclei (SCENIC loom rule)...
      keep_geneset_genes: true    # ...plus the Table 1 genes below 1% that are still detected
      geneset_min_cells: 1        # detected = count > 0 in >= 1 nucleus of the object (drops Prl4a1, Cts7, Prl2a1)
  figures:   # fig_zone_modules.py invocations, rendered for every run (light + dark, PNG + SVG + sidecar)
    # spatial panels are turned by resources/figures/mouse_section_rotation.yaml (rule zone_figures passes it to every
    # job; 3.5 dpi = 135 deg, so the file names keep _rot135); the "rot135" in the names below is a label only
    - name: spatial_3dpi_rot135_noapop
      args: "--figures spatial --timepoint 3.5_dpi --drop-apoptotic --modules PDZ,TDZ,SDZ,VSZ,MD,udStr"
    - name: spatial_3dpi_rot135_noapop_viridis
      args: "--figures spatial --timepoint 3.5_dpi --drop-apoptotic --modules PDZ,TDZ,SDZ,VSZ,MD,udStr --cmap viridis"
    - name: heatmap_3dpi_6zones_fibpooled_p99
      args: "--figures heatmap --heatmap-scale p99 --heatmap-timepoint 3.5_dpi --modules PDZ,TDZ,SDZ,VSZ,MD,udStr --pool-fib"
    - name: heatmap_3dpi_6zones_fibpooled_p99_viridis
      args: "--figures heatmap --heatmap-scale p99 --heatmap-timepoint 3.5_dpi --modules PDZ,TDZ,SDZ,VSZ,MD,udStr --pool-fib --cmap viridis"
